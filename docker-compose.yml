version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15
    container_name: fi-money-db
    environment:
      POSTGRES_DB: fi_money_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fi-money-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build: .
    container_name: fi-money-backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/fi_money_assistant
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-production-jwt-secret
      - OPENAI_API_KEY=your-openai-api-key
      - FI_MONEY_API_KEY=your-fi-money-api-key
      - FI_MONEY_API_URL=https://api.fimoney.com
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: fi-money-frontend
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fi-money-network